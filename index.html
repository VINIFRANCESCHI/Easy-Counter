<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Counter</title>
    <style>
        * {
            margin: 0;
            box-sizing: border-box;
          
        }

        body {
            min-height: 100vh;
            background: linear-gradient(50deg, #da87f3d8, #330668e3, #150724e3);
            color: white;
            display: grid;
            place-items: center;
        }

        section {
            background: rgba(16, 1, 26, 0.801);
            padding: 50px;
            border-radius: 5px;
            text-align: center;
            box-shadow: 9px 18px 25px rgb(5, 0, 5);
        }

        button {
             font-size: 35px;
             align-items: center;
             justify-content: space-around;
             height: 80px;
             width: 80px;
             border-radius: 5px;
             box-shadow: 4px 5px 16px rgba(199, 197, 197, 0.5);
             cursor: pointer;
             transition: tranform 0.1s ease, background-color 0.2s;
        }

        button:active {
          transform: scale(0.95);
          background-color: rgba(59, 52, 52, 0.5);
        }

        p {
            font-size: 200px;
            color: rgb(253, 254, 255);
            text-align: center;
        }

            
       

        h1 {
            font-family: 'Times New Roman', Times, serif
            color: rgb(255, 255, 255);
            font-size: 50px;
                    

        }

    </style>
</head>
<body>
   <section>
     <h1>Contador</h1>
     <p id="resultado"></p>
     <button onclick="aumentar()">+</button>
     <button onclick="diminuir()">-</button>
   </section>

   <script>

    // estado da minha aplicação
      let numero = 0

    // alteradores de estado da aplicação 

      function aumentar() {
        numero++
        mostrarNaTela()
      }
      function diminuir() {
        numero--
        mostrarNaTela()
      }

    // jogar o estado da aplicação na tela
      function mostrarNaTela() {
        const p = document.querySelector("#resultado")
        p.innerText = numero
      }

    // iniciar
    mostrarNaTela()

   </script>
</body>
</html>
